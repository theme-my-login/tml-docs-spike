name: Pages

on:
  push:
    branches: [main]
    paths:
      - bin/**
      - .github/workflows/pages.yml
  # Sent by a source repo when its PHP changes.
  repository_dispatch:
    types: [source-changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out the plugin being documented
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: theme-my-login/theme-my-login
          path: .source

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Vendor phpdoc-parser
        run: bash bin/install-parser.sh

      - name: Parse
        run: php -dmemory_limit=2g bin/parse.php .source api.json

      - name: Render
        run: |
          php bin/render.php api.json build .source \
            theme-my-login/theme-my-login \
            "$(git -C .source rev-parse HEAD)"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
