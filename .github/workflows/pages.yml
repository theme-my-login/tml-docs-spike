name: Pages

on:
  push:
    branches: [main]
    paths:
      - bin/**
      - .github/workflows/pages.yml
  # Sent by a source repo when its PHP changes.
  repository_dispatch:
    types: [source-changed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check out the plugin being documented
        uses: actions/checkout@v7
        with:
          repository: theme-my-login/theme-my-login
          path: .source

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          coverage: none

      - name: Vendor phpdoc-parser
        run: bash bin/install-parser.sh

      - name: Parse
        run: php -dmemory_limit=2g bin/parse.php .source api.json

      - name: Render
        run: |
          php bin/render.php api.json build \
            theme-my-login/theme-my-login \
            "$(git -C .source rev-parse HEAD)"

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
